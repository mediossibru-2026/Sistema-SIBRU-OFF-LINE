<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2e7d32">
  <title>Caja - Grupo SIBRÜ</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="https://res.cloudinary.com/sdhnyr5e/image/upload/v1793814011/Retrato_Google_con_Sonrisa.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/caja.css">
</head>
<body>
  <header class="main-header">
    <div class="header-left">
      <img src="https://res.cloudinary.com/sdhnyr5e/image/upload/v1793814011/Retrato_Google_con_Sonrisa.png" alt="SIBRÜ" class="header-logo">
      <h1>Terminal de Caja</h1>
    </div>
    <div class="header-info">
      <select id="selector-cajero"></select>
      <span id="estado-red" class="status-online">🟢 En línea</span>
    </div>
  </header>

  <main class="caja-container">
    <section class="panel-entrada">
      <div class="form-group">
        <label>Producto (Clave o Nombre)</label>
        <input type="text" id="busqueda" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-autocomplete="none" placeholder="Escribe y usa ↑↓ Enter...">
        <div id="sugerencias" class="sugerencias-box"></div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Cantidad</label>
          <input type="number" id="cantidad" step="0.01" min="0">
        </div>
        <div class="form-group">
          <label>Precio Unitario ($)</label>
          <input type="number" id="precio" step="0.01" min="0">
        </div>
      </div>
      <button id="btn-agregar" class="btn-agregar">AGREGAR (Enter)</button>
    </section>

    <section class="panel-carrito">
      <h3>Detalle de Venta</h3>
      <img src="https://res.cloudinary.com/sdhnyr5e/image/upload/v1793814011/Retrato_Google_con_Sonrisa.png" alt="" class="marca-agua">
      <table class="tabla-carrito">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cant.</th>
            <th>Precio</th>
            <th>Importe</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="carrito-body"></tbody>
      </table>
    </section>

    <section class="panel-cobro">
      <div class="form-group">
        <label>Forma de Pago</label>
        <select id="selector-pago"></select>
      </div>
      <div class="total-display">
        <span>TOTAL:</span>
        <span id="total-venta">$0.00</span>
      </div>
      <button id="btn-cobrar" class="btn-cobrar">COBRAR E IMPRIMIR (F2)</button>
    </section>
  </main>

    <!-- Modal de Historial -->
  <div id="modal-historial" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Historial de Tickets</h3>
        <button id="btn-cerrar-historial" class="btn-modal-close">✕</button>
      </div>
      <div class="modal-filters">
        <label>Fecha:</label>
        <input type="date" id="filtro-fecha-historial">
        <button id="btn-filtrar-historial" class="btn-primary-sm">Filtrar</button>
      </div>
      <div class="modal-body">
        <table class="tabla-historial">
          <thead>
            <tr>
              <th>Folio</th>
              <th>Hora</th>
              <th>Forma Pago</th>
              <th>Total</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="historial-body">
            <!-- Se llena dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module" src="js/main-caja.js"></script>
  <script>
    // Registrar Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((registration) => {
            console.log('✅ Service Worker registrado:', registration.scope);
          })
          .catch((error) => {
            console.error('❌ Error al registrar Service Worker:', error);
          });
      });
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'F2') {
        e.preventDefault();
        document.getElementById('btn-cobrar').click();
      }
    });

    window.addEventListener('online', () => document.getElementById('estado-red').textContent = '🟢 En línea');
    window.addEventListener('offline', () => document.getElementById('estado-red').textContent = '🔴 Sin conexión');
  </script>
</body>
</html>
